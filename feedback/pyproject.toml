[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "testlogica-feedback"
version = "1.0.0"
description = "Standalone feedback ingestion and aggregate chart service for TestLogica"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "matplotlib>=3.8,<4.0",
  "numpy>=1.26,<2.5",
  "pydantic>=2.6,<3.0",
  "uvicorn>=0.27,<1.0",
]

[project.scripts]
testlogica-feedback-admin = "feedback_service.admin:main"
testlogica-feedback-migrate = "feedback_service.migrate_legacy:main"
testlogica-feedback-worker = "feedback_service.worker:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "mypy>=1.10,<2",
  "pytest>=8,<9",
  "ruff>=0.5,<1",
]

[tool.setuptools.packages.find]
include = ["feedback_service*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
packages = ["feedback_service"]
warn_unused_ignores = true
check_untyped_defs = true
