name: API CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: API_Logica

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            API_Logica/pyproject.toml
            API_Logica/requirements.txt

      - name: Install SWI-Prolog
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends swi-prolog-nox

      - name: Install Python development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check server testlogica tests

      - name: mypy
        run: python -m mypy server testlogica

      - name: pytest
        run: python -m pytest

      - name: SWI-Prolog tests
        run: swipl -q -s prolog/tests/run_tests.pl

      - name: Build Docker image
        run: docker build --tag testlogica-api:ci .
