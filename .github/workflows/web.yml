name: Web CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Webpage_Logica

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.13.0"
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Verify frontend
        run: npm run verify

      - name: Build and verify static export
        run: npm run build

      - name: Check TypeScript
        run: npm run typecheck

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build container image
        run: docker build --tag testlogica-web:ci .

      - name: Start isolated Nginx for browser checks
        run: |
          docker run --detach --name testlogica-web-ci \
            --publish 127.0.0.1:18080:80 \
            --env API_UPSTREAM=http://127.0.0.1:9 \
            --env FEEDBACK_UPSTREAM=http://127.0.0.1:9 \
            testlogica-web:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/web-health; then
              exit 0
            fi
            sleep 1
          done
          docker logs testlogica-web-ci
          exit 1

      - name: Verify exported pages in Chromium
        run: npm run test:browser
        env:
          TEST_BASE_URL: http://127.0.0.1:18080

      - name: Stop test container
        if: always()
        run: docker rm --force testlogica-web-ci || true
