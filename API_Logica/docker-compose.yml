services:
  testlogica-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEFAULT_TIMEOUT: ${DEFAULT_TIMEOUT:-10}
      MAX_BATCH_SIZE: ${MAX_BATCH_SIZE:-50}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:12345,http://127.0.0.1:12345}
    ports:
      - "${API_PORT:-5000}:5000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/ready', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    pids_limit: 128
