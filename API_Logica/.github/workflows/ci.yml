name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install SWI-Prolog
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends swi-prolog-nox

      - name: Install Python development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check server testlogica tests

      - name: mypy
        run: python -m mypy server testlogica

      - name: pytest
        run: python -m pytest

      - name: SWI-Prolog tests
        run: swipl -q -s prolog/tests/run_tests.pl

      - name: Build Docker image
        run: docker build --tag testlogica-api:ci .
