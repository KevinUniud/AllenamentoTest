[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "testlogica-api"
version = "1.4.0"
description = "API and exercise generators for propositional logic"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141,<1.0",
  "pydantic>=2.6,<3.0",
  "uvicorn>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "mypy>=1.10,<3",
  "pytest>=8,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.5,<1",
]

[tool.setuptools.packages.find]
include = ["server*", "testlogica*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
packages = ["testlogica", "server"]
warn_unused_ignores = true
check_untyped_defs = true
