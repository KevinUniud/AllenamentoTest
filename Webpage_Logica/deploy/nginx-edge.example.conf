# Esempio da includere nel contesto `http` di Nginx sull'host. Sostituire
# logic.example.org e i percorsi dei certificati prima dell'attivazione.
limit_req_zone $binary_remote_addr zone=testlogica_feedback_per_client:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=testlogica_api_per_client:10m rate=300r/m;
limit_conn_zone $binary_remote_addr zone=testlogica_api_connections:10m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name logic.example.org;
    return 301 https://logic.example.org$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name logic.example.org;

    ssl_certificate /etc/letsencrypt/live/logic.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/logic.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    # HSTS appartiene all'edge che termina davvero TLS, non al container HTTP.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /api/revisione {
        access_log off;
        client_max_body_size 2m;
        limit_req zone=testlogica_feedback_per_client burst=60 nodelay;
        limit_req_status 429;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:12345;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
    }

    # Protezione per le operazioni logiche. La raffica e il limite connessioni
    # tengono conto di classi/NAT; il container API applica anche un limite
    # globale di concorrenza indipendente dall'indirizzo client.
    location /api/ {
        limit_req zone=testlogica_api_per_client burst=120 nodelay;
        limit_req_status 429;
        limit_conn testlogica_api_connections 32;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:12345;
        proxy_http_version 1.1;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
    }

    location / {
        proxy_pass http://127.0.0.1:12345;
        proxy_http_version 1.1;
        # L'API accetta operazioni fino a 120 secondi; il margine evita che
        # l'edge chiuda una risposta valida durante la serializzazione finale.
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
    }
}
